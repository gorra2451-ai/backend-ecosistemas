# Netlify publica solo el front unificado (D-018). El backend vive en supabase/.
[build]
  base = "web"
  command = "npm ci && npm run build"
  publish = "dist"
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeceras de seguridad (auditoría 2026-11-10, M3). Si cambia VITE_SUPABASE_URL, actualizar connect-src.
# style-src 'unsafe-inline': los divIcon de Leaflet llevan style="…". Referrer: OSM pide Referer válido.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), microphone=(self), camera=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self' https://hdaolwqvxofmvqahzjvp.supabase.co wss://hdaolwqvxofmvqahzjvp.supabase.co https://nominatim.openstreetmap.org https://routing.openstreetmap.de; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
